name: Sincronizar tardeos

# Mientras la app vieja siga viva es ella la que manda: los locales publican
# allí y aquí llega una foto fija. Sin esto, la app nueva se queda con lo que
# hubiera el día de la migración y se vacía sola según van pasando las fechas.
#
# Se ejecuta aquí y no en un cron del portátil porque el script habla directo
# con los dos Supabase: no necesita la app levantada ni que nadie tenga el
# ordenador encendido.
#
# OJO, DOS COSAS QUE HAY QUE TENER PRESENTES:
#
# 1. La app vieja MANDA. El script reescribe cada tardeo migrado con lo que
#    diga el origen. Si corriges un título o cambias un flyer desde el panel
#    nuevo, la sincronización de mañana te lo revierte. Mientras convivan las
#    dos apps, los tardeos migrados se editan en la vieja.
#    (Los creados aquí no se tocan: no tienen origen_id.)
#
# 2. No borra. Un evento eliminado en la app vieja simplemente deja de llegar,
#    pero el tardeo se queda aquí como estuviera. Los cancelados sí se
#    propagan, porque el origen los marca y el script lee ese estado.

on:
  schedule:
    # 06:15 UTC = 08:15 en España (07:15 en invierno). Antes de que empiece el
    # día, para que lo publicado ayer por la tarde ya esté cuando alguien mire.
    - cron: "15 6 * * *"
  workflow_dispatch:      # y a mano, desde la pestaña Actions

# Dos sincronizaciones a la vez se pisarían geocodificando y escribiendo.
concurrency:
  group: sincronizar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Ensayo (no escribe)
        env:
          VIEJO_URL: ${{ secrets.VIEJO_URL }}
          VIEJO_SERVICE_KEY: ${{ secrets.VIEJO_SERVICE_KEY }}
          NUEVO_URL: ${{ secrets.NUEVO_URL }}
          NUEVO_SERVICE_KEY: ${{ secrets.NUEVO_SERVICE_KEY }}
        run: node scripts/migrar.mjs

      - name: Sincronizar de verdad
        env:
          VIEJO_URL: ${{ secrets.VIEJO_URL }}
          VIEJO_SERVICE_KEY: ${{ secrets.VIEJO_SERVICE_KEY }}
          NUEVO_URL: ${{ secrets.NUEVO_URL }}
          NUEVO_SERVICE_KEY: ${{ secrets.NUEVO_SERVICE_KEY }}
        run: node scripts/migrar.mjs --escribir

      # La sincronización copia `image_url` tal cual, así que cada evento nuevo
      # llega apuntando al almacenamiento del proyecto viejo. Sin este paso, el
      # día que se apague ese proyecto los tardeos recién sincronizados se
      # quedan sin flyer aunque los antiguos ya estén rescatados.
      - name: Traer las imágenes nuevas al proyecto nuevo
        env:
          VIEJO_URL: ${{ secrets.VIEJO_URL }}
          VIEJO_SERVICE_KEY: ${{ secrets.VIEJO_SERVICE_KEY }}
          NUEVO_URL: ${{ secrets.NUEVO_URL }}
          NUEVO_SERVICE_KEY: ${{ secrets.NUEVO_SERVICE_KEY }}
        run: node scripts/traer-imagenes.mjs --escribir

      # La app vieja no tiene el campo `tipo_evento`, así que todo lo que llega
      # por la sincronización llega sin él. Sin este paso el filtro de tipo de
      # evento se queda vacío para siempre: se rellenó a mano una vez con los
      # 662 migrados y al día siguiente los nuevos ya volvían sin tipo.
      #
      # Va DESPUÉS de sincronizar porque lee lo que acaba de llegar, y es
      # seguro repetirlo: solo escribe donde está vacío, nunca pisa lo que haya
      # puesto un local a mano, y el upsert de migrar.mjs no incluye la columna,
      # así que lo que escriba aquí sobrevive a la pasada de mañana.
      - name: Deducir el tipo de evento de los que acaban de llegar
        env:
          NUEVO_URL: ${{ secrets.NUEVO_URL }}
          NUEVO_SERVICE_KEY: ${{ secrets.NUEVO_SERVICE_KEY }}
        run: node scripts/clasificar-tipos.mjs --escribir

      # Avisar a la web de que hay datos nuevos.
      #
      # Sin esto la web se entera cuando le toque regenerarse sola, y eso falló:
      # el 20 de agosto estuvo ocho horas enseñando 17 tardeos con 33 en la
      # base, respondiendo STALE sin rehacerse nunca hasta que se reinició el
      # proceso.
      #
      # `continue-on-error` a propósito: los datos ya están escritos y esto es
      # solo el aviso. Si la web estuviera caída en ese momento, no tiene
      # sentido marcar en rojo una sincronización que sí funcionó.
      - name: Avisar a la web
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Sin CRON_SECRET: me salto el aviso. Añádelo en Settings -> Secrets."
            exit 0
          fi
          curl -sS -f -X POST https://crm.gnerai.com/api/revalidar \
            -H "x-cron-secret: $CRON_SECRET"
          echo
