# /etc/nginx/sites-available/tardeosclub.com (20-oct-2026)
# Mantenimiento para el público y app para el equipo: ver snippets/tardeos-app.conf.
server {
  server_name tardeosclub.com www.tardeosclub.com;
  include /etc/nginx/snippets/anti-escaneo.conf;
  include /etc/nginx/snippets/tardeos-app.conf;

  listen [::]:443 ssl; # managed by Certbot
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/tardeosclub.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/tardeosclub.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
  if ($host = tardeosclub.com) { return 301 https://$host$request_uri; } # managed by Certbot
  if ($host = www.tardeosclub.com) { return 301 https://$host$request_uri; } # managed by Certbot
  listen 80;
  listen [::]:80;
  server_name tardeosclub.com www.tardeosclub.com;
  return 404; # managed by Certbot
}
