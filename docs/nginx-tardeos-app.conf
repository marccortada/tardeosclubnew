# /etc/nginx/snippets/tardeos-app.conf (20-oct-2026)
#
# Lo incluyen los server de tardeosclub.com y crm.gnerai.com. Mientras la web esté
# "en mantenimiento", el público ve SOLO la página de mantenimiento (503, en todas las
# rutas) y el equipo ve la app entera. La diferencia es una cookie `tc_acceso`, que se
# consigue abriendo una vez /llave-equipo?k=<LLAVE> (y se borra con /llave-equipo?salir=1).
#
# La llave NO está en el repo: en el servidor sustituye a __LLAVE__ aquí y en
# /etc/nginx/conf.d/tardeos-llave.conf (map $cookie_tc_acceso -> $tc_equipo).
# Para dejar fuera a todo el mundo, basta con cambiarla en esos dos sitios y recargar.
#
# Para LANZAR: quitar el `if ($tc_equipo = 0)` de `location /` y recargar.

root /var/www/tardeosclub.com;   # la página de mantenimiento (estática, la web antigua)

location = /llave-equipo {
  if ($arg_k = "__LLAVE__") {
    add_header Set-Cookie "tc_acceso=__LLAVE__; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
    return 302 /;
  }
  if ($arg_salir) {
    add_header Set-Cookie "tc_acceso=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
    return 302 /;
  }
  return 302 /;
}

# Mantenimiento: 503 + Retry-After, que es lo que entiende Google como "vuelve luego".
error_page 503 /__mantenimiento;
location = /__mantenimiento {
  internal;
  add_header Cache-Control "no-store" always;
  add_header Retry-After "86400" always;
  try_files /index.html =404;
}

# Ficheros que carga la página de mantenimiento (la app no usa estas rutas).
location /assets/ {
  try_files $uri =404;
  expires 30d;
  add_header Cache-Control "public, max-age=2592000, immutable";
}
location = /favicon.png { try_files $uri =404; }
location = /manifest.webmanifest { try_files $uri =404; }

# Siempre abierto: el cron (/api/avisos, /api/recordatorios) y los errores del navegador.
location /api/ {
  proxy_pass http://127.0.0.1:3005;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# La app: solo con la llave.
location / {
  if ($tc_equipo = 0) { return 503; }
  proxy_pass http://127.0.0.1:3005;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
}
